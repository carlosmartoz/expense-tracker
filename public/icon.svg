<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The app's own surface and text tokens as literals: a file served to the
       browser can't read the stylesheet. Keep in step with globals.css. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- lucide ArrowRightLeft, the mark the sidebar already uses for the ledger.
       Its 24-unit box sits at 4,4; the ink inside centres on the tile. -->
  <g transform="translate(4 4)" fill="none" stroke="#f5f5f5" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m16 3 4 4-4 4"/>
    <path d="M20 7H4"/>
    <path d="m8 21-4-4 4-4"/>
    <path d="M4 17h16"/>
  </g>
</svg>
